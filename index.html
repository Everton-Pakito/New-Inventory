<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1e40af">
    <meta name="description" content="Sistema de Cadastro e Inventário de Veículos">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAAACXBIWXMAAAsTAAALEwEAmpwYAAAA0klEQVRYhe2WsQ3CMBBFn5GYgBGYADrKbMAGjMAGbMAIbMAGjMAGSJRuBDZgBEaADZAoKBLhODY+h0RIfqnK1r17/s52bCBJkiT5D1wBC+AK7A0bYAfUwBM4AutYAx6Aqe2ngLmF1UDu4lXEBOh+xZ8xBlRzE6Dbm/iXGgXv2xoFH9saBS/aGgUv2hoFL9kaBU/bGgUP2xoF99saBXfbGgW32xoFt9oaBTfbGgU32BoF19saBVfaGgWX2xoFF9oaBefbGgVn2hoFp9saBSfbGgUnxPsCL+3pOIflqh8AAAAASUVORK5CYII=">
    <title>Sistema de Inventário de Veículos - V22</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            flex-direction: column;
        }

        .container {
            max-width: 1200px;
            width: 100%;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .header {
            background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
        }

        .nav {
            display: flex;
            background: #f3f4f6;
            border-bottom: 2px solid #e5e7eb;
            overflow-x: auto;
        }

        .nav button {
            flex: 1;
            min-width: 120px;
            padding: 15px 10px;
            border: none;
            background: transparent;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #6b7280;
            transition: all 0.3s;
            white-space: nowrap;
        }

        .nav button.active {
            background: white;
            color: #1e40af;
            border-bottom: 3px solid #1e40af;
        }

        .content {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
            animation: fadeIn 0.3s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #374151;
            font-size: 14px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            transition: border 0.3s;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
            display: inline-block;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
        }

        .btn-secondary {
            background: #6b7280;
            color: white;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-danger {
            background: #ef4444;
            color: white;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .module-container {
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            background: #f9fafb;
        }

        .module-header {
            background: #1e40af;
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-weight: 600;
            font-size: 16px;
        }

        .table-container {
            overflow-x: auto;
            margin-top: 20px;
            -webkit-overflow-scrolling: touch;
        }

        table {
            width: 100%;
            min-width: 600px;
            border-collapse: collapse;
            background: white;
            border-radius: 8px;
            overflow: hidden;
        }

        th {
            background: #1e40af;
            color: white;
            padding: 12px;
            text-align: left;
            font-weight: 600;
            font-size: 13px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #e5e7eb;
            font-size: 13px;
        }

        tr:hover {
            background: #f3f4f6;
        }

        .actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d1fae5;
            border: 2px solid #10b981;
            color: #065f46;
        }

        .alert-error {
            background: #fee2e2;
            border: 2px solid #ef4444;
            color: #991b1b;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .page-title {
            color: #1e40af;
            margin-bottom: 20px;
            font-size: 22px;
            font-weight: 700;
        }

        .footer {
            background: #f9fafb;
            border-top: 2px solid #e5e7eb;
            padding: 15px;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
        }

        .footer strong {
            color: #1e40af;
        }

        .button-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            body {
                padding: 5px;
            }

            .container {
                border-radius: 15px;
            }

            .header {
                padding: 15px;
            }

            .header h1 {
                font-size: 20px;
            }

            .header p {
                font-size: 12px;
            }

            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .nav {
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
            }

            .nav button {
                font-size: 13px;
                padding: 12px 10px;
                min-width: 100px;
            }

            .content {
                padding: 15px;
            }

            .page-title {
                font-size: 18px;
            }

            .btn {
                width: 100%;
                margin-right: 0;
            }

            .button-group {
                flex-direction: column;
            }

            .module-container {
                padding: 12px;
            }

            .module-header {
                font-size: 14px;
            }

            input, select {
                font-size: 16px;
            }

            th, td {
                font-size: 12px;
                padding: 8px;
            }

            .actions {
                flex-direction: column;
            }

            .btn-small {
                width: 100%;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 18px;
            }

            .nav button {
                font-size: 12px;
                padding: 10px 8px;
                min-width: 80px;
            }

            .content {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚛 Sistema de Inventário de Veículos</h1>
            <p>Gestão de Frota e Composições - V22</p>
        </div>

        <div class="nav">
            <button class="active" onclick="showPage('cadastro')">➕ Cadastro</button>
            <button onclick="showPage('inventario')">📋 Inventário</button>
        </div>

        <div class="content">
            <!-- Página de Cadastro -->
            <div id="cadastro" class="page active">
                <h2 class="page-title">Novo Cadastro</h2>
                
                <div class="form-group">
                    <label>Tipo de Cadastro:</label>
                    <select id="tipoCadastro" onchange="changeTipoCadastro()">
                        <option value="">Selecione...</option>
                        <option value="veiculo">Veículo</option>
                        <option value="composicao">Composição</option>
                    </select>
                </div>

                <!-- Formulário Veículo -->
                <div id="formVeiculo" style="display:none;">
                    <div class="form-group">
                        <label>Tipo de Veículo:</label>
                        <select id="veiculoTipo">
                            <option value="">Selecione...</option>
                            <option value="Leve">Leve</option>
                            <option value="Semi-Leve">Semi-Leve</option>
                            <option value="Cavalo Mecânico">Cavalo Mecânico</option>
                        </select>
                    </div>

                    <div class="grid-2">
                        <div class="form-group">
                            <label>Status:</label>
                            <select id="veiculoStatus">
                                <option value="">Selecione...</option>
                                <option value="Ativo">Ativo</option>
                                <option value="Inativo">Inativo</option>
                                <option value="Manutenção">Manutenção</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Frota:</label>
                            <input type="text" id="veiculoFrota" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
                        </div>

                        <div class="form-group">
                            <label>Placa:</label>
                            <input type="text" id="veiculoPlaca" maxlength="8" placeholder="ABC-1234" style="text-transform: uppercase;" oninput="formatarPlaca(this)">
                        </div>

                        <div class="form-group">
                            <label>Chassi:</label>
                            <input type="text" id="veiculoChassi" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
                        </div>

                        <div class="form-group">
                            <label>Marca:</label>
                            <select id="veiculoMarca" onchange="atualizarModelosVeiculo()">
                                <option value="">Selecione...</option>
                                <option value="SCANIA">SCANIA</option>
                                <option value="VOLVO">VOLVO</option>
                                <option value="MERCEDES">MERCEDES</option>
                                <option value="VOLKSWAGEN">VOLKSWAGEN</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Modelo:</label>
                            <select id="veiculoModelo">
                                <option value="">Selecione a marca primeiro</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Ano:</label>
                            <input type="number" id="veiculoAno">
                        </div>
                    </div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="salvarVeiculo()">💾 Salvar Veículo</button>
                        <button class="btn btn-secondary" onclick="limparFormulario()">🔄 Limpar</button>
                    </div>
                </div>

                <!-- Formulário Composição -->
                <div id="formComposicao" style="display:none;">
                    <div class="form-group">
                        <label>Tipo de Composição:</label>
                        <select id="composicaoTipo" onchange="changeComposicaoTipo()">
                            <option value="">Selecione...</option>
                            <option value="1">1 Módulo (Solteiro)</option>
                            <option value="2">2 Módulos (Duplado)</option>
                            <option value="3a">3 Módulos (Duplado + Dolly)</option>
                            <option value="3b">3 Módulos (Tremiado)</option>
                            <option value="4">4 Módulos (Tremiado + Dolly)</option>
                        </select>
                    </div>

                    <div id="modulosContainer"></div>

                    <div class="button-group">
                        <button class="btn btn-primary" onclick="salvarComposicao()">💾 Salvar Composição</button>
                        <button class="btn btn-secondary" onclick="limparFormulario()">🔄 Limpar</button>
                    </div>
                </div>
            </div>

            <!-- Página de Inventário -->
            <div id="inventario" class="page">
                <h2 class="page-title">Inventário</h2>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>Visualizar:</label>
                        <select id="inventarioTipo" onchange="carregarInventario()">
                            <option value="veiculos">Veículos</option>
                            <option value="composicoes">Composições</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>🔍 Buscar (Placa, Frota, ID, Chassi):</label>
                        <input type="text" id="buscaInventario" placeholder="Digite para buscar..." style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase(); filtrarInventario()">
                    </div>
                </div>

                <div class="button-group">
                    <button class="btn btn-primary" onclick="carregarInventario()">🔄 Atualizar</button>
                    <button class="btn btn-secondary" onclick="limparBusca()">🗑️ Limpar Busca</button>
                </div>

                <div id="inventarioContent" class="loading">
                    Carregando inventário...
                </div>
            </div>
        </div>

        <div class="footer">
            Desenvolvido com ❤️ por <strong>Everton Tezzon Ferreira</strong>
        </div>
    </div>

    <script>
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw5e6wBxr4_z2FrMRvdzT2nV7_KEafl_M_AW2J3pT3wxV7wKVTJldoFINqOJ6baKjAb/exec';
        let editingId = null;
        let inventarioAtual = []; // Armazena dados atuais do inventário

        // Modelos de veículos por marca
        const modelosPorMarca = {
            'SCANIA': [
                'G560 A6X4 XT CS',
                'G560 A6X4 XT'
            ],
            'VOLVO': [],
            'MERCEDES': [],
            'VOLKSWAGEN': []
        };

        function atualizarModelosVeiculo() {
            const marca = document.getElementById('veiculoMarca').value;
            const selectModelo = document.getElementById('veiculoModelo');
            
            selectModelo.innerHTML = '<option value="">Selecione...</option>';
            
            if (marca && modelosPorMarca[marca]) {
                const modelos = modelosPorMarca[marca];
                
                if (modelos.length > 0) {
                    modelos.forEach(modelo => {
                        const option = document.createElement('option');
                        option.value = modelo;
                        option.textContent = modelo;
                        selectModelo.appendChild(option);
                    });
                } else {
                    selectModelo.innerHTML = '<option value="">Nenhum modelo cadastrado</option>';
                }
            }
        }

        function formatarPlaca(input) {
            let valor = input.value.replace(/[^A-Z0-9]/gi, '').toUpperCase();
            
            if (valor.length > 3) {
                valor = valor.substring(0, 3) + '-' + valor.substring(3, 7);
            }
            
            input.value = valor;
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
            
            document.getElementById(pageId).classList.add('active');
            event.target.classList.add('active');

            if (pageId === 'inventario') {
                carregarInventario();
            }
        }

        function changeTipoCadastro() {
            const tipo = document.getElementById('tipoCadastro').value;
            document.getElementById('formVeiculo').style.display = tipo === 'veiculo' ? 'block' : 'none';
            document.getElementById('formComposicao').style.display = tipo === 'composicao' ? 'block' : 'none';
            editingId = null;
        }

        function changeComposicaoTipo() {
            const tipoSelecionado = document.getElementById('composicaoTipo').value;
            const container = document.getElementById('modulosContainer');
            container.innerHTML = '';

            let numModulos = 0;
            if (tipoSelecionado === '1') numModulos = 1;
            else if (tipoSelecionado === '2') numModulos = 2;
            else if (tipoSelecionado === '3a' || tipoSelecionado === '3b') numModulos = 3;
            else if (tipoSelecionado === '4') numModulos = 4;

            for (let i = 1; i <= numModulos; i++) {
                container.innerHTML += createModuloForm(i);
            }
        }

        function createModuloForm(numero) {
            return `
                <div class="module-container">
                    <div class="module-header">Módulo ${numero}</div>
                    
                    <div class="grid-2">
                        <div class="form-group">
                            <label>Status:</label>
                            <select id="mod${numero}Status">
                                <option value="">Selecione...</option>
                                <option value="Ativo">Ativo</option>
                                <option value="Inativo">Inativo</option>
                                <option value="Manutenção">Manutenção</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Tipo:</label>
                            <select id="mod${numero}Tipo">
                                <option value="">Selecione...</option>
                                <option value="Semi-Reboque">Semi-Reboque</option>
                                <option value="Reboque">Reboque</option>
                                <option value="Dolly-Reboque">Dolly-Reboque</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Frota:</label>
                            <input type="text" id="mod${numero}Frota" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
                        </div>

                        <div class="form-group">
                            <label>Placa:</label>
                            <input type="text" id="mod${numero}Placa" maxlength="8" placeholder="ABC-1234" style="text-transform: uppercase;" oninput="formatarPlaca(this)">
                        </div>

                        <div class="form-group">
                            <label>Chassi:</label>
                            <input type="text" id="mod${numero}Chassi" style="text-transform: uppercase;" oninput="this.value = this.value.toUpperCase()">
                        </div>

                        <div class="form-group">
                            <label>Marca:</label>
                            <select id="mod${numero}Marca">
                                <option value="">Selecione...</option>
                                <option value="Fachinni">Fachinni</option>
                                <option value="Randon">Randon</option>
                                <option value="Usicamp">Usicamp</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Ano:</label>
                            <input type="number" id="mod${numero}Ano">
                        </div>
                    </div>
                </div>
            `;
        }

        function preencherCamposVazios(dados, isMod = false) {
            // Campos de texto padrão
            const camposTexto = ['frota', 'chassi', 'marca', 'modelo', 'ano'];
            camposTexto.forEach(campo => {
                if (!dados[campo] || dados[campo].toString().trim() === '') {
                    dados[campo] = 'Sem Dados';
                }
            });

            // Campo placa específico
            if (!dados.placa || dados.placa.trim() === '') {
                dados.placa = 'SEM-PLAC';
            }

            // Campos de seleção
            if (!dados.status || dados.status === '') {
                dados.status = 'Sem Dados';
            }

            if (!dados.tipo || dados.tipo === '') {
                dados.tipo = 'Sem Dados';
            }

            if (!isMod) {
                if (!dados.tipoVeiculo || dados.tipoVeiculo === '') {
                    dados.tipoVeiculo = 'Sem Dados';
                }
            }

            return dados;
        }

        async function salvarVeiculo() {
            let dados = {
                tipo: 'veiculo',
                tipoVeiculo: document.getElementById('veiculoTipo').value,
                status: document.getElementById('veiculoStatus').value,
                frota: document.getElementById('veiculoFrota').value,
                placa: document.getElementById('veiculoPlaca').value,
                chassi: document.getElementById('veiculoChassi').value,
                marca: document.getElementById('veiculoMarca').value,
                modelo: document.getElementById('veiculoModelo').value,
                ano: document.getElementById('veiculoAno').value
            };

            // Preencher campos vazios
            dados = preencherCamposVazios(dados);

            // Verificar duplicação apenas se não estiver editando
            if (!editingId && dados.placa !== 'SEM-PLAC') {
                const duplicado = await verificarDuplicacaoVeiculo(dados.placa, dados.chassi);
                if (duplicado) {
                    return;
                }
            }

            try {
                const formData = new URLSearchParams();
                formData.append('action', editingId ? 'update' : 'create');
                if (editingId) formData.append('id', editingId);
                formData.append('data', JSON.stringify(dados));
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(editingId ? '✅ Veículo atualizado com sucesso!' : '✅ Veículo cadastrado com sucesso!');
                    limparFormulario();
                    editingId = null;
                } else {
                    alert('❌ Erro: ' + result.message);
                }
            } catch (error) {
                alert('❌ Erro ao salvar: ' + error.message);
            }
        }

        async function salvarComposicao() {
            const tipoSelecionado = document.getElementById('composicaoTipo').value;
            
            if (!tipoSelecionado) {
                alert('⚠️ Selecione o tipo de composição!');
                return;
            }
            
            const tiposConfig = {
                '1': 'Solteiro',
                '2': 'Duplado',
                '3a': 'Duplado + Dolly',
                '3b': 'Tremiado',
                '4': 'Tremiado + Dolly'
            };
            
            const tipoConfig = tiposConfig[tipoSelecionado];
            
            let numModulos = 0;
            if (tipoSelecionado === '1') numModulos = 1;
            else if (tipoSelecionado === '2') numModulos = 2;
            else if (tipoSelecionado === '3a' || tipoSelecionado === '3b') numModulos = 3;
            else if (tipoSelecionado === '4') numModulos = 4;
            
            const modulos = [];
            for (let i = 1; i <= numModulos; i++) {
                let modulo = {
                    status: document.getElementById(`mod${i}Status`).value,
                    tipo: document.getElementById(`mod${i}Tipo`).value,
                    frota: document.getElementById(`mod${i}Frota`).value,
                    placa: document.getElementById(`mod${i}Placa`).value,
                    chassi: document.getElementById(`mod${i}Chassi`).value,
                    marca: document.getElementById(`mod${i}Marca`).value,
                    ano: document.getElementById(`mod${i}Ano`).value
                };

                // Preencher campos vazios
                modulo = preencherCamposVazios(modulo, true);
                modulos.push(modulo);
            }

            // Verificar duplicação de placas entre módulos
            const placas = modulos.map(m => m.placa).filter(p => p !== 'SEM-PLAC');
            const placasDuplicadas = placas.filter((p, index) => placas.indexOf(p) !== index);
            if (placasDuplicadas.length > 0) {
                alert(`⚠️ A placa "${placasDuplicadas[0]}" está duplicada entre os módulos!`);
                return;
            }

            // Verificar duplicação no banco apenas se não estiver editando
            if (!editingId) {
                for (let i = 0; i < modulos.length; i++) {
                    if (modulos[i].placa !== 'SEM-PLAC') {
                        const duplicado = await verificarDuplicacaoVeiculo(modulos[i].placa, modulos[i].chassi);
                        if (duplicado) {
                            alert(`⚠️ Módulo ${i + 1}: Placa ou chassi já cadastrado!`);
                            return;
                        }
                    }
                }
            }

            const dados = {
                tipo: 'composicao',
                tipoComposicao: tipoConfig,
                numModulos: numModulos,
                modulos: modulos
            };

            try {
                const formData = new URLSearchParams();
                formData.append('action', editingId ? 'update' : 'create');
                if (editingId) formData.append('id', editingId);
                formData.append('data', JSON.stringify(dados));
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });

                const result = await response.json();
                
                if (result.success) {
                    alert(editingId ? '✅ Composição atualizada com sucesso!' : '✅ Composição cadastrada com sucesso!');
                    limparFormulario();
                    editingId = null;
                } else {
                    alert('❌ Erro: ' + result.message);
                }
            } catch (error) {
                alert('❌ Erro ao salvar: ' + error.message);
            }
        }

        function limparFormulario() {
            document.getElementById('tipoCadastro').value = '';
            document.getElementById('formVeiculo').style.display = 'none';
            document.getElementById('formComposicao').style.display = 'none';
            document.getElementById('modulosContainer').innerHTML = '';
            
            document.querySelectorAll('input, select').forEach(el => {
                if (el.type === 'number' || el.type === 'text') el.value = '';
                if (el.tagName === 'SELECT') el.selectedIndex = 0;
            });
            
            editingId = null;
        }

        async function carregarInventario() {
            const tipo = document.getElementById('inventarioTipo').value;
            document.getElementById('inventarioContent').innerHTML = '<div class="loading">⏳ Carregando dados...</div>';
            document.getElementById('buscaInventario').value = '';

            try {
                const response = await fetch(`${WEB_APP_URL}?action=list&tipo=${tipo}`, {
                    method: 'GET',
                    redirect: 'follow'
                });
                
                const data = await response.json();

                if (data.success && data.data.length > 0) {
                    inventarioAtual = data.data;
                    mostrarTabela(inventarioAtual, tipo);
                } else {
                    inventarioAtual = [];
                    document.getElementById('inventarioContent').innerHTML = 
                        '<div class="alert alert-error">📭 Nenhum registro encontrado</div>';
                }
            } catch (error) {
                inventarioAtual = [];
                document.getElementById('inventarioContent').innerHTML = 
                    '<div class="alert alert-error">❌ Erro ao carregar dados: ' + error.message + '</div>';
            }
        }

        function filtrarInventario() {
            const busca = document.getElementById('buscaInventario').value.toUpperCase();
            const tipo = document.getElementById('inventarioTipo').value;
            
            if (!busca) {
                mostrarTabela(inventarioAtual, tipo);
                return;
            }

            let dadosFiltrados = [];

            if (tipo === 'veiculos') {
                dadosFiltrados = inventarioAtual.filter(v => {
                    return (v.id && v.id.toUpperCase().includes(busca)) ||
                           (v.placa && v.placa.toUpperCase().includes(busca)) ||
                           (v.frota && v.frota.toUpperCase().includes(busca)) ||
                           (v.chassi && v.chassi.toUpperCase().includes(busca)) ||
                           (v.tipoVeiculo && v.tipoVeiculo.toUpperCase().includes(busca)) ||
                           (v.marca && v.marca.toUpperCase().includes(busca)) ||
                           (v.modelo && v.modelo.toUpperCase().includes(busca));
                });
            } else {
                dadosFiltrados = inventarioAtual.filter(c => {
                    let match = (c.id && c.id.toUpperCase().includes(busca)) ||
                               (c.tipoComposicao && c.tipoComposicao.toUpperCase().includes(busca));
                    
                    if (!match && c.modulos) {
                        const modulos = typeof c.modulos === 'string' ? JSON.parse(c.modulos) : c.modulos;
                        match = modulos.some(m => 
                            (m.placa && m.placa.toUpperCase().includes(busca)) ||
                            (m.frota && m.frota.toUpperCase().includes(busca)) ||
                            (m.chassi && m.chassi.toUpperCase().includes(busca))
                        );
                    }
                    
                    return match;
                });
            }

            if (dadosFiltrados.length > 0) {
                mostrarTabela(dadosFiltrados, tipo);
            } else {
                document.getElementById('inventarioContent').innerHTML = 
                    '<div class="alert alert-error">🔍 Nenhum resultado encontrado para "' + busca + '"</div>';
            }
        }

        function limparBusca() {
            document.getElementById('buscaInventario').value = '';
            const tipo = document.getElementById('inventarioTipo').value;
            mostrarTabela(inventarioAtual, tipo);
        }

        function mostrarTabela(dados, tipo) {
            let html = '<div class="table-container"><table>';
            
            if (tipo === 'veiculos') {
                html += `
                    <thead>
                        <tr>
                            <th>Placa 🚗</th>
                            <th>Frota</th>
                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Status</th>
                            <th>Marca</th>
                            <th>Modelo</th>
                            <th>Chassi</th>
                            <th>Ano</th>
                            <th>Cadastro</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                `;
                
                dados.forEach(v => {
                    html += `
                        <tr>
                            <td><strong>${v.placa}</strong></td>
                            <td>${v.frota}</td>
                            <td><small>${v.id}</small></td>
                            <td>${v.tipoVeiculo}</td>
                            <td>${v.status}</td>
                            <td>${v.marca}</td>
                            <td>${v.modelo}</td>
                            <td><small>${v.chassi}</small></td>
                            <td>${v.ano}</td>
                            <td><small>${v.dataCadastro || 'N/A'}</small></td>
                            <td class="actions">
                                <button class="btn btn-secondary btn-small" onclick="editarVeiculo('${v.id}', ${JSON.stringify(v).replace(/"/g, '&quot;')})">✏️ Editar</button>
                                <button class="btn btn-danger btn-small" onclick="excluirRegistro('${v.id}')">🗑️ Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            } else {
                html += `
                    <thead>
                        <tr>
                            <th>Placas 🚗</th>
                            <th>ID</th>
                            <th>Tipo Composição</th>
                            <th>Nº Módulos</th>
                            <th>Cadastro</th>
                            <th>Ações</th>
                        </tr>
                    </thead>
                    <tbody>
                `;
                
                dados.forEach(c => {
                    const modulos = typeof c.modulos === 'string' ? JSON.parse(c.modulos) : c.modulos;
                    const placas = modulos.map(m => m.placa).join(' | ');
                    
                    html += `
                        <tr>
                            <td><strong>${placas}</strong></td>
                            <td><small>${c.id}</small></td>
                            <td>${c.tipoComposicao}</td>
                            <td>${c.numModulos}</td>
                            <td><small>${c.dataCadastro || 'N/A'}</small></td>
                            <td class="actions">
                                <button class="btn btn-secondary btn-small" onclick="editarComposicao('${c.id}', ${JSON.stringify(c).replace(/"/g, '&quot;')})">✏️ Editar</button>
                                <button class="btn btn-danger btn-small" onclick="excluirRegistro('${c.id}')">🗑️ Excluir</button>
                            </td>
                        </tr>
                    `;
                });
            }
            
            html += '</tbody></table></div>';
            html += `<div style="margin-top: 15px; color: #6b7280; font-size: 14px;">
                        📊 Total de registros: <strong>${dados.length}</strong>
                     </div>`;
            document.getElementById('inventarioContent').innerHTML = html;
        }

        async function excluirRegistro(id) {
            if (!confirm('⚠️ Tem certeza que deseja excluir este registro?\n\nEsta ação não pode ser desfeita.')) return;

            try {
                const formData = new URLSearchParams();
                formData.append('action', 'delete');
                formData.append('id', id);
                
                const response = await fetch(WEB_APP_URL, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (result.success) {
                    alert('✅ Registro excluído com sucesso!');
                    carregarInventario();
                } else {
                    alert('❌ Erro ao excluir: ' + result.message);
                }
            } catch (error) {
                alert('❌ Erro ao excluir: ' + error.message);
            }
        }

        function editarVeiculo(id, dados) {
            editingId = id;
            
            showPage('cadastro');
            document.querySelectorAll('.nav button')[0].classList.add('active');
            
            document.getElementById('tipoCadastro').value = 'veiculo';
            changeTipoCadastro();
            
            document.getElementById('veiculoTipo').value = dados.tipoVeiculo;
            document.getElementById('veiculoStatus').value = dados.status;
            document.getElementById('veiculoFrota').value = dados.frota === 'Sem Dados' ? '' : dados.frota;
            document.getElementById('veiculoPlaca').value = dados.placa === 'SEM-PLAC' ? '' : dados.placa;
            document.getElementById('veiculoChassi').value = dados.chassi === 'Sem Dados' ? '' : dados.chassi;
            document.getElementById('veiculoMarca').value = dados.marca === 'Sem Dados' ? '' : dados.marca;
            atualizarModelosVeiculo();
            document.getElementById('veiculoModelo').value = dados.modelo === 'Sem Dados' ? '' : dados.modelo;
            document.getElementById('veiculoAno').value = dados.ano === 'Sem Dados' ? '' : dados.ano;
            
            window.scrollTo(0, 0);
        }

        function editarComposicao(id, dados) {
            editingId = id;
            
            showPage('cadastro');
            document.querySelectorAll('.nav button')[0].classList.add('active');
            
            document.getElementById('tipoCadastro').value = 'composicao';
            changeTipoCadastro();
            
            const tiposMap = {
                'Solteiro': '1',
                'Duplado': '2',
                'Duplado + Dolly': '3a',
                'Tremiado': '3b',
                'Tremiado + Dolly': '4'
            };
            
            document.getElementById('composicaoTipo').value = tiposMap[dados.tipoComposicao] || '';
            changeComposicaoTipo();
            
            const modulos = typeof dados.modulos === 'string' ? JSON.parse(dados.modulos) : dados.modulos;
            modulos.forEach((mod, index) => {
                const i = index + 1;
                document.getElementById(`mod${i}Status`).value = mod.status;
                document.getElementById(`mod${i}Tipo`).value = mod.tipo;
                document.getElementById(`mod${i}Frota`).value = mod.frota === 'Sem Dados' ? '' : mod.frota;
                document.getElementById(`mod${i}Placa`).value = mod.placa === 'SEM-PLAC' ? '' : mod.placa;
                document.getElementById(`mod${i}Chassi`).value = mod.chassi === 'Sem Dados' ? '' : mod.chassi;
                document.getElementById(`mod${i}Marca`).value = mod.marca === 'Sem Dados' ? '' : mod.marca;
                document.getElementById(`mod${i}Ano`).value = mod.ano === 'Sem Dados' ? '' : mod.ano;
            });
            
            window.scrollTo(0, 0);
        }

        async function verificarDuplicacaoVeiculo(placa, chassi) {
            try {
                const responseVeiculos = await fetch(`${WEB_APP_URL}?action=list&tipo=veiculos`);
                const dataVeiculos = await responseVeiculos.json();
                
                if (dataVeiculos.success && dataVeiculos.data) {
                    for (const veiculo of dataVeiculos.data) {
                        if (veiculo.placa && veiculo.placa === placa && placa !== 'SEM-PLAC') {
                            alert(`⚠️ DUPLICAÇÃO!\n\nPlaca "${placa}" já cadastrada!\n\nVeículo: ${veiculo.tipoVeiculo}\nFrota: ${veiculo.frota}\nID: ${veiculo.id}`);
                            return true;
                        }
                        if (chassi && veiculo.chassi && veiculo.chassi === chassi && chassi !== 'Sem Dados') {
                            alert(`⚠️ DUPLICAÇÃO!\n\nChassi "${chassi}" já cadastrado!\n\nVeículo: ${veiculo.tipoVeiculo}\nPlaca: ${veiculo.placa}\nID: ${veiculo.id}`);
                            return true;
                        }
                    }
                }
                
                const responseComposicoes = await fetch(`${WEB_APP_URL}?action=list&tipo=composicoes`);
                const dataComposicoes = await responseComposicoes.json();
                
                if (dataComposicoes.success && dataComposicoes.data) {
                    for (const comp of dataComposicoes.data) {
                        const modulos = typeof comp.modulos === 'string' ? JSON.parse(comp.modulos) : comp.modulos;
                        
                        for (let i = 0; i < modulos.length; i++) {
                            const mod = modulos[i];
                            if (mod.placa && mod.placa === placa && placa !== 'SEM-PLAC') {
                                alert(`⚠️ DUPLICAÇÃO!\n\nPlaca "${placa}" já cadastrada!\n\nComposição: ${comp.tipoComposicao}\nMódulo: ${i + 1}\nID: ${comp.id}`);
                                return true;
                            }
                            if (chassi && mod.chassi && mod.chassi === chassi && chassi !== 'Sem Dados') {
                                alert(`⚠️ DUPLICAÇÃO!\n\nChassi "${chassi}" já cadastrado!\n\nComposição: ${comp.tipoComposicao}\nMódulo: ${i + 1}\nID: ${comp.id}`);
                                return true;
                            }
                        }
                    }
                }
                
                return false;
            } catch (error) {
                console.error('Erro ao verificar duplicação:', error);
                return false;
            }
        }

        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').then(() => {
                console.log('Service Worker registrado');
            });
        }

        window.addEventListener('load', () => {
            if (document.getElementById('inventario').classList.contains('active')) {
                carregarInventario();
            }
        });
    </script>
</body>
</html>
